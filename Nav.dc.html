<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* 標題排版鐵律:一行說一句話。text-wrap:balance 讓瀏覽器把行長平均分配,
   不會把最後一兩個字擠成孤字行(手機與電腦同樣適用);分句 span 各自成行。 */
h1,h2{text-wrap:balance}

#pq-burger{display:none}
@media (max-width:959px){#pq-links{display:none!important}#pq-burger{display:flex!important}}

/* 手機選單「產品」收合:子項恆常展開時 scrollHeight 1048 > 812,iPhone 12 mini 會把
   「關於我們」、Demo 按鈕與聯絡資訊全推到摺線下。收起來才一屏放得下,同時 chevron
   就是使用者要的「這是下拉選單」的提示。 */
.pqm-kids{animation:pqmKids .3s cubic-bezier(.16,1,.3,1) both}
@keyframes pqmKids{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.pqm-chev{animation:pqmChevHint 1.9s ease-in-out 1.1s 2 both}
@keyframes pqmChevHint{0%,58%,100%{transform:translateY(0)}70%{transform:translateY(3px)}82%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  .pqm-kids,.pqm-chev{animation:none!important}
}

/* ══════════════════════════════════════════════════════════════════════════════
   縫縫獸 SEAMLINGS ── 手機選單彩蛋
   純 CSS keyframes + inline SVG:零 JS、零 rAF、零函式庫、零外部資源。
   選單在 <sc-if value="{{ open }}"> 內,每次開啟都重新掛載 DOM,動畫自動從頭播。

   ── 五條結構性保證(是結構,不是調參數調到剛好)────────────────────────────
   1) .pqm-seam 是 position:fixed;inset:0;overflow:hidden;contain:layout paint
      → 小獸再怎麼位移/旋轉/縮放都被裁掉,數學上不可能撐出水平捲軸;
      → fixed 不是 flex item,插在 dialog 第一個子元素不改變任何一列的高度,
        也不影響頁尾那個 margin-top:auto;
      → contain 把重繪與 style 重算封在這一層,選單捲動時外層不必重算。
   2) z-index:-1 → dialog 本身 position:fixed + z-index:300 已建立堆疊環境,
      依繪製順序 -1 的子層落在「dialog 自己的底色之上、所有內容之下」,
      文字與連結永遠畫在小獸上面。這同時是可讀性保證,也是「牠們躲在介面後面」
      的視覺語言。
   3) pointer-events:none(父層 + 萬用字元雙保險)+ aria-hidden + focusable="false"
      → 不吃點擊、不進 a11y tree;容器是 <div>/<span>/<svg>,沒有 a[href] 也沒有
        button,不會被 Nav.dc.html:274 的 querySelectorAll('a[href],button')
        focus trap 抓到,Tab 序列與加彩蛋前完全相同。
   4) 「縫」一律是螢幕的四個邊,絕對不可以改成 absolute 去對齊選單的分隔線。
      ★ 這是鐵律,不是偏好 ★ 分隔線的位置由三件事共同決定:字級 clamp(24px,6vw,34px)、
      中文換行、以及 content.js 裡「產品」子項的筆數(隨時會增減)。任何一次改文案
      都會讓寫死的 top 值失準、壓到字上。螢幕邊緣是永遠存在、永遠對齊、不隨內容
      改變的縫。日後若有人想「順手」改成 absolute 去對齊某一列,請先讀這段。
   5) 週期 23/29/31/37/41 秒全是質數且兩兩互質,可見率壓到 12%
      → 實算前 48.5 秒畫面上嚴格一次只有一隻(見下方排程表)。

   ── 失敗方向 ────────────────────────────────────────────────────────────
   所有動畫宣告都包在 @media (prefers-reduced-motion:no-preference) 內,而每一隻的
   「基態 transform」都是躲好的狀態(左右兩隻更是連盒子都在畫面外)。所以在
   不支援 CSS 動畫、動畫被停用、或 keyframes 拼錯的任何情況下,失敗方向永遠是
   「看不見」,不是「卡一坨東西在選單上」。

   ── 命名 ──────────────────────────────────────────────────────────────
   這段 CSS 進 <helmet><style> 會全站生效,所以:
   ・class 一律 pqm- 前綴,且一律用 .pqm-nk .pqm-eye 這種雙層選擇器(等同有作用域),
     不要為了省字改成裸的 .pqm-eye。
   ・keyframes 一律 pqmSeam* 前綴。已核對全庫:與 pqmKids / pqmChevHint /
     pqPulse / pqPageIn / pqBot* / pqMon* / pqb1~pqb6* / pqFlow* 全無衝突。

   ── 誠實揭露:哪些是決定,不是疏漏 ──────────────────────────────────────
   ・刻意不加 will-change:13 個動畫節點裡有 5 個是常駐無限循環,提層記憶體不划算,
     而且 transform-only 動畫本來就走合成路徑。中低階 Android 上寧可少 5 張圖層。
   ・刻意不做「選單打開時整層淡入」:那需要第二條動畫搶同一個 transform。基態
     transform 已經把牠們藏好,不需要 opacity 動畫,也就少一個出錯的地方。
   ・張望與擺盪刻意「不」另開節點,直接烘進母動畫的 rotate 段落,把節點壓在 13 個內。
   ・第 48.5 秒之後兩隻會開始偶爾同框(五段可見窗總長 25.7s > 最短週期 23s,
     數學上不可能永遠不重疊)。因為週期兩兩互質,重疊點會一直漂移,永遠不會變成
     整齊的同時探頭 —— 但「永遠不同框」是做不到的,不要在文件裡那樣宣稱。
   ・reduced-motion 採「整層不顯示」而非「留一隻靜態站著」:彩蛋的本體就是動,
     關掉動就不該在螢幕左右各卡一塊 15px 的色塊給要求減少動態的人看。
   ══════════════════════════════════════════════════════════════════════════ */

.pqm-seam{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:layout paint}
.pqm-seam *{pointer-events:none}

/* 三道關閉閘門:電腦版 NAV 不做動畫;橫向手機/矮視窗選單本身已經很擠;
   要求減少動態的人一律整層不顯示(與上面 no-preference 閘門互為雙保險)。 */
@media (min-width:960px){.pqm-seam{display:none}}
@media (max-height:559px){.pqm-seam{display:none}}
@media (prefers-reduced-motion:reduce){.pqm-seam{display:none}}

.pqm-nk{position:absolute;display:block}
.pqm-nk>svg{display:block;width:100%;height:100%}
.pqm-nk .pqm-eye,.pqm-nk .pqm-bd{transform-box:fill-box}
.pqm-nk .pqm-eye{transform-origin:50% 50%}
.pqm-nk .pqm-bd{transform-origin:50% 100%}

/* ── 五個藏身點 ────────────────────────────────────────────────────────────
   n1 的 right 跟著 ✕ 鈕走,不是魔術數字:✕ 的右緣就是 dialog 的
   padding-right = clamp(20px,6vw,48px),✕ 寬 44px,再留 14px 縫隙。
   實算 320 / 375 / 430 三個寬度,n1 右緣距 ✕ 左緣恆為 14px。
   n2 / n3 的盒子整個放在畫面外(left/right:-36px),所以「藏起來」是
   translateX(0) —— 不需要任何位移就已經是安全的,這也是失效保護。
   n2 / n3 用 % 不用 vh:.pqm-seam 是 fixed+inset:0,兩者在此完全等價,
   但 % 相對這一層自己的高度,不受 iOS 動態工具列影響,少一個變數。
   兩隻底部小獸用 env(safe-area-inset-bottom),iPhone Home Indicator
   那條白線不會切到臉。 */
.pqm-nk.pqm-n1{top:-6px;right:calc(clamp(20px,6vw,48px) + 58px);width:40px;height:84px}
.pqm-nk.pqm-n2{left:-36px;top:38%;width:36px;height:52px}
.pqm-nk.pqm-n3{right:-36px;top:22%;width:36px;height:52px}
.pqm-nk.pqm-n4{left:calc(50% + 4px);bottom:env(safe-area-inset-bottom,0px);width:46px;height:48px}
.pqm-nk.pqm-n5{right:calc(clamp(20px,6vw,48px) + 44px);bottom:env(safe-area-inset-bottom,0px);width:32px;height:30px}

/* 旋轉軸一律設在「牠貼著的那條螢幕邊」上 —— 這樣歪頭讀起來是
   「從縫裡把頭探出來張望」,而不是「整個身體歪掉」。
   同時這裡的 transform 就是基態(躲好):沒有動畫時什麼都看不到。 */
.pqm-n1>svg{transform-origin:50% 0;transform:translate3d(0,-108%,0)}
.pqm-n2>svg{transform-origin:100% 50%;transform:translate3d(0,0,0)}
.pqm-n3>svg{transform-origin:0 50%;transform:translate3d(0,0,0)}
.pqm-n4>svg{transform-origin:50% 100%;transform:translate3d(0,106%,0)}
.pqm-n5>svg{transform-origin:50% 100%;transform:translate3d(0,112%,0)}

/* ── 出場排程 = 彩蛋的發現感 ──────────────────────────────────────────────
   負的 animation-delay 把動畫快轉到指定進度。可見窗 = 週期的 66%→78%(12%)。
     n2 毛毛(左)  T=23s  delay -14.63s → 可見 0.55–3.31s
     n1 奇奇(倒吊)T=29s  delay -15.54s → 可見 3.60–7.08s
     n3 毛毛(右)  T=31s  delay -13.06s → 可見 7.40–11.12s
     n4 芽芽(下)  T=37s  delay -12.92s → 可見 11.50–15.94s
     n5 豆豆(下)  T=41s  delay -10.66s → 可見 16.40–21.32s
   → 0.55 秒就有第一隻(答「打開那一秒」),8 秒內看得到三隻,
     第五隻要等 16.4 秒(答「彩蛋」)。實算前 48.5 秒一次只有一隻;
     第一次重疊發生在 48.5s(n2 第三輪與 n4 第二輪),之後因互質而持續漂移。 */
@media (prefers-reduced-motion:no-preference){
  .pqm-n2>svg{animation:pqmSeamL    23s ease-in-out -14.63s infinite both}
  .pqm-n1>svg{animation:pqmSeamHang 29s ease-in-out -15.54s infinite both}
  .pqm-n3>svg{animation:pqmSeamR    31s ease-in-out -13.06s infinite both}
  .pqm-n4>svg{animation:pqmSeamRise 37s ease-in-out -12.92s infinite both}
  .pqm-n5>svg{animation:pqmSeamBob  41s ease-in-out -10.66s infinite both}

  /* 眨眼週期與各自的母週期兩兩互質(43/290、37/230、53/310、29/370、61/410
     都約不掉),所以每一次探頭出現時眼睛的相位都不一樣 —— 有時剛冒出來就眨,
     有時盯著你三秒都不眨,看起來像有脾氣,不像在跑迴圈。 */
  .pqm-n1 .pqm-eye{animation:pqmSeamBlink 4.3s ease-in-out infinite}
  .pqm-n2 .pqm-eye{animation:pqmSeamBlink 3.7s ease-in-out infinite}
  .pqm-n3 .pqm-eye{animation:pqmSeamBlink 5.3s ease-in-out infinite}
  .pqm-n4 .pqm-eye{animation:pqmSeamBlink 2.9s ease-in-out infinite}
  .pqm-n5 .pqm-eye{animation:pqmSeamBlink 6.1s ease-in-out infinite}

  /* 呼吸只給三隻軟身型。眼睛與嘴不在 .pqm-bd 內,所以身體漲縮時五官不動,
     讀起來是在呼吸而不是整隻在放大。呼吸週期同樣與母週期互質。 */
  .pqm-n1 .pqm-bd{animation:pqmSeamBreathe 3.4s ease-in-out infinite}
  .pqm-n2 .pqm-bd{animation:pqmSeamBreathe 2.6s ease-in-out infinite}
  .pqm-n4 .pqm-bd{animation:pqmSeamBreathe 3.1s ease-in-out infinite}
}

/* ── 母動畫:五條,骨架一致 ────────────────────────────────────────────────
   0–66%   完全躲在縫裡(位移出裁切框,看不到)
   66–70%  彈出並故意衝過頭,同時「拉長」(軟身體剎不住)
   70–72%  著地那一格「擠扁」← 最扁的一格
   72–73.5% 回彈拉長 → 坐定
   73.5–76.5% 停在原地左右歪頭張望(旋轉軸就在牠貼著的那條螢幕邊)
   76.5–78% 先做一個往回縮的預備動作,再迅速縮回去
   78–100% 繼續躲著
   每一格都寫滿 translate3d + rotate + scale 三項,確保瀏覽器做的是逐項插值
   而不是矩陣插值(不會歪掉)。只動 transform,零 layout、零 opacity。 */

/* 奇奇:從螢幕上緣倒吊垂下來,落定後像鐘擺盪四下(+2.4/−3/+2.6/−1.8)才停 */
@keyframes pqmSeamHang{
  0%,66%   {transform:translate3d(0,-108%,0) rotate(0deg)    scale(1,1);animation-timing-function:cubic-bezier(.28,1.24,.5,1)}
  70%      {transform:translate3d(0,5%,0)    rotate(0deg)    scale(.9,1.14)}
  72%      {transform:translate3d(0,-1%,0)   rotate(2.4deg)  scale(1.16,.86)}
  73.5%    {transform:translate3d(0,1%,0)    rotate(-3deg)   scale(.95,1.06)}
  75%      {transform:translate3d(0,0,0)     rotate(2.6deg)  scale(1,1)}
  76%      {transform:translate3d(0,0,0)     rotate(-1.8deg) scale(1,1)}
  76.5%    {transform:translate3d(0,2%,0)    rotate(0deg)    scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.25)}
  78%,100% {transform:translate3d(0,-108%,0) rotate(0deg)    scale(1,1)}
}

/* 毛毛(左緣):只探出 15px。過衝峰值 17px —— dialog 左內距在 320px 寬被 clamp
   夾到 20px 下限,所以最壞情況仍留 3px 淨空;375 是 5.5px、430 是 8.8px。
   旋轉軸 100% 50% 就是螢幕左邊那條線本身,scale 也往畫面外擴張,
   所以旋轉與縮放都「不會」增加向右侵入文字欄的量。 */
@keyframes pqmSeamL{
  0%,66%   {transform:translate3d(0,0,0)    rotate(0deg)  scale(1,1);animation-timing-function:cubic-bezier(.28,1.3,.5,1)}
  70%      {transform:translate3d(17px,0,0) rotate(0deg)  scale(1.12,.9)}
  72%      {transform:translate3d(11px,0,0) rotate(-2deg) scale(.93,1.08)}
  73.5%    {transform:translate3d(15px,0,0) rotate(.6deg) scale(1,1)}
  75%      {transform:translate3d(15px,0,0) rotate(7deg)  scale(1,1)}
  76.5%    {transform:translate3d(15px,0,0) rotate(-5deg) scale(1,1)}
  77%      {transform:translate3d(9px,0,0)  rotate(0deg)  scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.25)}
  78%,100% {transform:translate3d(0,0,0)    rotate(0deg)  scale(1,1)}
}

/* 毛毛(右緣):上式鏡像,角度符號全部相反,旋轉軸改成 0 50%(螢幕右邊那條線)。
   露出 15px 時左緣落在 375→x360 / 360→x345 / 320→x305,
   對應內容右邊界 352.5 / 338.4 / 300,淨空 7.5 / 6.6 / 5px;
   過衝 17px 時仍有 5.5 / 4.6 / 3px。 */
@keyframes pqmSeamR{
  0%,66%   {transform:translate3d(0,0,0)     rotate(0deg)   scale(1,1);animation-timing-function:cubic-bezier(.28,1.3,.5,1)}
  70%      {transform:translate3d(-17px,0,0) rotate(0deg)   scale(1.12,.9)}
  72%      {transform:translate3d(-11px,0,0) rotate(2deg)   scale(.93,1.08)}
  73.5%    {transform:translate3d(-15px,0,0) rotate(-.6deg) scale(1,1)}
  75%      {transform:translate3d(-15px,0,0) rotate(-7deg)  scale(1,1)}
  76.5%    {transform:translate3d(-15px,0,0) rotate(5deg)   scale(1,1)}
  77%      {transform:translate3d(-9px,0,0)  rotate(0deg)   scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.25)}
  78%,100% {transform:translate3d(0,0,0)     rotate(0deg)   scale(1,1)}
}

/* 芽芽:從畫面最下緣整隻浮起來,張望時像不倒翁(旋轉軸在底部中心) */
@keyframes pqmSeamRise{
  0%,66%   {transform:translate3d(0,106%,0) rotate(0deg)    scale(1,1);animation-timing-function:cubic-bezier(.28,1.3,.5,1)}
  70%      {transform:translate3d(0,-7%,0)  rotate(0deg)    scale(.92,1.13)}
  72%      {transform:translate3d(0,2%,0)   rotate(0deg)    scale(1.2,.82)}
  73.5%    {transform:translate3d(0,-1%,0)  rotate(0deg)    scale(.94,1.07)}
  74.5%    {transform:translate3d(0,0,0)    rotate(0deg)    scale(1,1)}
  75.5%    {transform:translate3d(0,0,0)    rotate(-6.5deg) scale(1,1)}
  76.5%    {transform:translate3d(0,0,0)    rotate(5.5deg)  scale(1,1)}
  77%      {transform:translate3d(0,-3%,0)  rotate(0deg)    scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.25)}
  78%,100% {transform:translate3d(0,106%,0) rotate(0deg)    scale(1,1)}
}

/* 豆豆:同樣從下緣起來,但只停在 18% —— 身體還泡在水面下,只有頭跟一顆大眼睛露出來 */
@keyframes pqmSeamBob{
  0%,66%   {transform:translate3d(0,112%,0) rotate(0deg)  scale(1,1);animation-timing-function:cubic-bezier(.28,1.3,.5,1)}
  70%      {transform:translate3d(0,8%,0)   rotate(0deg)  scale(.93,1.12)}
  72%      {transform:translate3d(0,23%,0)  rotate(0deg)  scale(1.18,.84)}
  73.5%    {transform:translate3d(0,15%,0)  rotate(0deg)  scale(.96,1.05)}
  74.5%    {transform:translate3d(0,18%,0)  rotate(0deg)  scale(1,1)}
  75.5%    {transform:translate3d(0,18%,0)  rotate(-8deg) scale(1,1)}
  76.5%    {transform:translate3d(0,18%,0)  rotate(7deg)  scale(1,1)}
  77%      {transform:translate3d(0,12%,0)  rotate(0deg)  scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.25)}
  78%,100% {transform:translate3d(0,112%,0) rotate(0deg)  scale(1,1)}
}

/* ── 子動畫:眨眼與呼吸(與母動畫完全獨立,作用在 SVG 內的群組上)────────── */
/* 一輪只有約 4% 的時間在眨,其餘時間睜著 */
@keyframes pqmSeamBlink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
/* 以底部中心為軸「壓扁再回彈」的擠壓感,不是整體放大 */
@keyframes pqmSeamBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.94)}}
</style>
</helmet>
<header style="position:fixed;top:0;left:0;right:0;height:68px;box-sizing:border-box;z-index:100;background:rgba(242,239,232,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(9,11,14,.12)">
  <div style="max-width:1400px;margin:0 auto;padding:0 clamp(16px,4vw,48px);height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="/" aria-label="PeakQi 奇鋒國際 首頁" style="display:flex;align-items:center;gap:10px;color:#090B0E;text-decoration:none">
      <img src="assets/logo.png" alt="PeakQi" width="32" height="32" style="display:block">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 220}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;solutions&quot;, &quot;cases&quot;, &quot;pricing&quot;, &quot;about&quot;, &quot;demo&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;導覽&quot;}, &quot;sticky&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;導覽&quot;}, &quot;ctaThreshold&quot;: {&quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 1, &quot;step&quot;: 0.05, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;導覽&quot;}}">
class Component extends DCLogic {
  state = { open: false, nav: null, ctaOk: false, dismissed: false, grp: null };
  componentDidMount() {
    import('./content.js').then(m => this.setState({ nav: m.navigation }));
    import('./micro-engine.js').then(m => {
      if (window.__pqMicro) return;
      window.__pqMicro = m.createMicro();
      window.__pqMicro.start();
    }).catch(() => {});
    import('./analytics.js').then(m => { this._tk = m.track; }).catch(() => {});
    let dismissed = false;
    try { dismissed = sessionStorage.getItem('pqCtaDismissed') === '1'; } catch (e) {}
    const thr = parseFloat(this.props.ctaThreshold ?? 0) || 0;
    this._thr = thr;
    if (dismissed) { this.setState({ dismissed: true }); return; }
    if (thr <= 0) {
      this.setState({ ctaOk: true });
      if ((this.props.active ?? '') !== 'demo' && (this.props.sticky ?? true)) this._evt('sticky_demo_view');
      return;
    }
    this._onScroll = () => {
      const de = document.scrollingElement || document.documentElement;
      const ratio = de.scrollTop / Math.max(1, de.scrollHeight - window.innerHeight);
      if (ratio >= thr && !this.state.ctaOk) {
        this.setState({ ctaOk: true });
        this._evt('sticky_demo_view');
        window.removeEventListener('scroll', this._onScroll);
        this._onScroll = null;
      }
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }
  componentWillUnmount() {
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
  }
  _evt(type) {
    const page = this.props.active ?? '';
    if (this._tk) { this._tk(type, { page }); return; }
    const e = { type, ts: Date.now(), page };
    (window.__pqEvents = window.__pqEvents || []).push(e);
    try { window.dispatchEvent(new CustomEvent('pq:event', { detail: e })); } catch (err) {}
  }
  renderVals() {
    const active = this.props.active ?? '';
    const base = {
      font: "500 14px 'Noto Sans TC',sans-serif", letterSpacing: '.04em', textDecoration: 'none',
      padding: '4px 2px', transition: 'color .15s'
    };
    // 注意:實際選單來自 content.js 的 navigation(下面這組只是載入前的備援,改它不會生效)
    const items = this.state.nav ?? [
      { href: '/', key: 'home', label: '首頁' },
      { href: '/solutions', key: 'solutions', label: '解決方案' },
      { href: '/method', key: 'method', label: '導入方法' },
      { href: '/cases', key: 'cases', label: '案例' },
      { href: '/peakops', key: 'product', label: '產品' },
      { href: '/about', key: 'about', label: '關於我們' }
    ];
    const childStyle = {
      display: 'flex', flexDirection: 'column', gap: '2px', textDecoration: 'none',
      padding: '10px 14px', minHeight: '44px', justifyContent: 'center',
      borderRadius: '7px', color: '#F2EFE8'
    };
    const mChildStyle = {
      display: 'flex', flexDirection: 'column', gap: '1px', textDecoration: 'none',
      // 觸控區至少 44px:原本 padding 11px 上下只有約 20px 可點範圍
      padding: '11px 0', minHeight: '44px', justifyContent: 'center',
      color: 'rgba(242,239,232,.82)'
    };
    const openGrp = this.state.grp;
    const links = items.map((l, i) => {
      const isGroup = Array.isArray(l.children) && l.children.length > 0;
      const kidsOpen = isGroup && openGrp === l.key;
      return {
        ...l,
        idx: '0' + (i + 1),
        isGroup, isLink: !isGroup,
        href: l.href || '#',
        // 手機:子項預設收起。恆常展開時整份選單 1048px,iPhone 12 mini(812)裝不下,
        // 「關於我們」與底部 CTA 會被推到摺線下;收起後一屏看得完,chevron 同時是下拉提示。
        showKids: kidsOpen,
        kidsExpanded: kidsOpen ? 'true' : 'false',
        kidsId: 'pq-grp-' + (l.key || i),
        kidCount: isGroup ? String(l.children.length) : '',
        toggleKids: () => this.setState({ grp: this.state.grp === l.key ? null : l.key }),
        groupBtnStyle: {
          display: 'flex', alignItems: 'baseline', gap: '12px', width: '100%',
          background: 'none', border: 'none', cursor: 'pointer',
          padding: '18px 0', minHeight: '44px', textAlign: 'left',
          font: "700 clamp(24px,6vw,34px)/1.2 'Noto Sans TC',sans-serif",
          color: l.key === active ? '#FF6B2C' : '#F2EFE8'
        },
        kidCountStyle: {
          flex: '0 0 auto', display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          minWidth: '23px', height: '23px', borderRadius: '999px', alignSelf: 'center',
          background: kidsOpen ? 'rgba(255,107,44,.2)' : 'rgba(242,239,232,.1)',
          color: kidsOpen ? '#FF6B2C' : 'rgba(242,239,232,.62)',
          font: "700 12px 'Space Grotesk',sans-serif"
        },
        chevStyle: {
          display: 'inline-block', font: "400 19px 'Noto Sans TC',sans-serif", lineHeight: 1,
          color: kidsOpen ? '#FF6B2C' : 'rgba(242,239,232,.78)',
          transition: 'transform .24s cubic-bezier(.16,1,.3,1), color .2s',
          transform: kidsOpen ? 'rotate(180deg)' : 'rotate(0deg)'
        },
        children: isGroup ? l.children.map(c => ({ ...c, style: childStyle, mStyle: mChildStyle, target: c.ext ? '_blank' : '_self', rel: c.ext ? 'noopener noreferrer' : '' })) : [],
        style: {
          ...base,
          color: l.key === active ? '#090B0E' : 'rgba(9,11,14,.6)',
          fontWeight: l.key === active ? 700 : 500,
          borderBottom: l.key === active ? '2px solid #FF6B2C' : '2px solid transparent'
        },
        btnStyle: {
          ...base, display: 'inline-flex', alignItems: 'center', gap: '5px',
          // borderBottom 與一般連結一致(2px):border:none 會讓盒高矮 2px,
          // 在 align-items:center 的列裡整顆「產品」看起來往下掉
          background: 'none', border: 'none', cursor: 'pointer',
          borderBottom: l.key === active ? '2px solid #FF6B2C' : '2px solid transparent',
          color: l.key === active ? '#090B0E' : 'rgba(9,11,14,.6)',
          fontWeight: l.key === active ? 700 : 500
        },
        mobileStyle: {
          display: 'flex', alignItems: 'baseline', gap: '12px', textDecoration: 'none',
          padding: '18px 0', borderBottom: '1px solid rgba(242,239,232,.12)',
          font: "700 clamp(24px,6vw,34px)/1.2 'Noto Sans TC',sans-serif",
          color: l.key === active ? '#FF6B2C' : '#F2EFE8'
        }
      };
    });
    const openMenu = () => {
      this._lastFocus = document.activeElement;
      this.setState({ open: true, grp: null });   // 每次打開都回到「一屏看得完」的收合狀態
      setTimeout(() => { if (this._closeEl) this._closeEl.focus(); }, 60);
    };
    const closeMenu = () => {
      this.setState({ open: false });
      const back = this._lastFocus || this._burgerEl;
      if (back && back.focus) setTimeout(() => back.focus(), 40);
    };
    return {
      links,
      open: this.state.open,
      menuExpanded: this.state.open ? 'true' : 'false',
      burgerRef: (el) => { this._burgerEl = el; },
      closeRef: (el) => { this._closeEl = el; },
      menuKeys: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
        if (e.key === 'Tab') { // 輕量 focus trap
          const root = e.currentTarget;
          const f = root.querySelectorAll('a[href],button');
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      toggle: () => { this.state.open ? closeMenu() : openMenu(); },
      close: closeMenu,
      showSticky: (this.props.sticky ?? true) && active !== 'demo' && !this.state.dismissed && this.state.ctaOk,
      // 浮動 pill 統一導向 LINE 官方帳號加好友(全站同一個出口,最低門檻的聯絡方式);
      // 各頁 hero 與段落內的主 CTA 維持原本的表單/Demo 動線,不受影響。
      ctaHref: 'https://lin.ee/saa67pr',
      ctaLabel: '加 LINE 好友',
      ctaBadge: true,
      ctaBadgeText: '官方帳號',
      navDemoClick: () => this._evt('nav_demo_click'),
      ctaClick: () => this._evt('sticky_line_click'),
      ctaDismiss: () => {
        try { sessionStorage.setItem('pqCtaDismissed', '1'); } catch (e) {}
        this._evt('cta_dismiss');
        this.setState({ dismissed: true });
      }
    };
  }
}
</script>
</body>
</html>
