<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#090B0E;color:#F2EFE8">
  <div style="max-width:1400px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,48px) clamp(24px,3vw,32px);display:flex;flex-direction:column;gap:clamp(36px,5vw,56px)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(28px,3.5vw,40px);align-items:start">
      <div style="display:flex;flex-direction:column;gap:16px;max-width:340px">
        <div style="display:flex;align-items:center;gap:10px">
          <img src="/assets/logo.png" alt="PeakQi" width="36" height="36" style="display:block">
          <span style="display:flex;flex-direction:column;gap:2px;line-height:1">
            <span style="font:800 1.0625rem 'Space Grotesk',sans-serif;letter-spacing:.01em;color:#F2EFE8">PeakQi</span>
            <span style="font:600 .59375rem 'Noto Sans TC',sans-serif;letter-spacing:.24em;color:rgba(242,239,232,.55)">{{ brandSub }}</span>
          </span>
        </div>
        <p style="margin:0;font:400 .875rem/1.8 'Noto Sans TC',sans-serif;color:rgba(242,239,232,.62)">{{ blurb }}</p>
        <span style="font:600 .6875rem 'Space Grotesk',sans-serif;letter-spacing:.3em;color:rgba(242,239,232,.35)">FROM CHAOS TO CONTROL</span>
      </div>
      <nav style="display:flex;flex-direction:column;gap:12px">
        <span style="font:600 .6875rem 'Space Grotesk',sans-serif;letter-spacing:.28em;color:rgba(242,239,232,.4)">SITEMAP</span>
        <sc-for list="{{ siteLinks }}" as="l" hint-placeholder-count="8">
          <a href="{{ l.href }}" style="color:rgba(242,239,232,.78);text-decoration:none;font:500 .9375rem 'Noto Sans TC',sans-serif;min-height:44px;display:inline-flex;align-items:center" style-hover="color:#FF6B2C">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font:600 .6875rem 'Space Grotesk',sans-serif;letter-spacing:.28em;color:rgba(242,239,232,.4)">SERVICES</span>
        <sc-for list="{{ services }}" as="s" hint-placeholder-count="5">
          <span style="color:rgba(242,239,232,.62);font:400 .875rem/1.7 'Noto Sans TC',sans-serif">{{ s }}</span>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font:600 .6875rem 'Space Grotesk',sans-serif;letter-spacing:.28em;color:rgba(242,239,232,.4)">CONTACT</span>
        <a href="mailto:jacky@peakqi.com" style="min-height:44px;display:inline-flex;align-items:center;color:#F2EFE8;text-decoration:none;font:500 .9375rem 'Space Grotesk',sans-serif" style-hover="color:#FF6B2C">jacky@peakqi.com</a>
        <a href="tel:0266093699" style="min-height:44px;display:inline-flex;align-items:center;color:#F2EFE8;text-decoration:none;font:500 .9375rem 'Space Grotesk',sans-serif" style-hover="color:#FF6B2C">(02) 6609-3699</a>
        <a href="https://lin.ee/saa67pr" target="_blank" rel="noopener" style="min-height:44px;display:inline-flex;align-items:center;gap:8px;color:#F2EFE8;text-decoration:none;font:500 .9375rem 'Noto Sans TC',sans-serif" style-hover="color:#06C755"><span style="width:8px;height:8px;border-radius:50%;background:#06C755"></span>{{ lineLabel }}</a>
        <a href="https://peakqi.com" target="_blank" rel="noopener" style="min-height:44px;display:inline-flex;align-items:center;color:#F2EFE8;text-decoration:none;font:500 .9375rem 'Space Grotesk',sans-serif" style-hover="color:#FF6B2C">peakqi.com</a>
        <a href="{{ demoHref }}" aria-label="{{ demoLabel }}" style="margin-top:8px;min-height:44px;display:inline-flex;align-items:center;gap:8px;color:#FF6B2C;text-decoration:none;font:700 .875rem 'Noto Sans TC',sans-serif" style-hover="color:#F2EFE8">{{ demoLabel }} →</a>
      </div>
    </div>
    <div style="border-top:1px solid rgba(242,239,232,.14);padding-top:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
      <span style="font:400 .78125rem 'Noto Sans TC',sans-serif;color:rgba(242,239,232,.45)">© 2026 {{ legal }} PEAKQI Co., Ltd.<a href="{{ privacyHref }}" style="margin-left:14px;color:rgba(242,239,232,.55);text-decoration:underline;text-underline-offset:3px" style-hover="color:#FF6B2C">{{ privacyLabel }}</a></span>
      <span style="font:500 .6875rem 'Space Grotesk',sans-serif;letter-spacing:.24em;color:rgba(242,239,232,.35)">AI OPERATING SYSTEM FOR TAIWAN SMB</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 520}}">
class Component extends DCLogic {
  state = { i18n: false };
  componentDidMount() {
    // 共用 Footer 雙語:絕對路徑(/en/ 頁也解析得到);載入前 T fallback 回傳中文
    import('/i18n.js').then(m => { this._t = m.t; this._lang = m.LANG; this.setState({ i18n: true }); }).catch(() => {});
  }
  renderVals() {
    const T = this._t || ((z) => z);
    const EP = (h) => (this._lang === 'en' && h.charAt(0) === '/' ? (h === '/' ? '/en/' : '/en' + h) : h);
    return {
      brandSub: T('奇鋒國際', 'PEAKQI INTERNATIONAL'),
      blurb: T('協助企業把 AI 接進真實營運流程的導入團隊。先盤點流程、選一個高價值場景驗證,再串接既有工具、資料與人員,並保留權限與人工審核。', 'A rollout team that plugs AI into how your business actually runs. We map the flow, prove one high-value scenario, then wire in your tools, data and people — with permissions and human review intact.'),
      siteLinks: [
        { href: EP('/'), label: T('首頁', 'Home') },
        { href: EP('/solutions'), label: T('解決方案', 'Solutions') },
        { href: EP('/method'), label: T('導入方法', 'How we deliver') },
        { href: EP('/cases'), label: T('案例與作品', 'Cases & work') },
        { href: EP('/studio'), label: T('接案・模組價格', 'Studio & rates') },
        { href: EP('/peakops'), label: 'Peak Ops' },
        { href: EP('/pricing'), label: T('方案說明', 'Pricing') },
        { href: EP('/about'), label: T('關於 PeakQi', 'About PeakQi') },
        { href: EP('/blog'), label: T('觀點', 'Insights') },
        { href: EP('/demo'), label: T('預約 AI 導入評估', 'Build your Phase-1 draft') }
      ],
      services: [
        T('AI 接客・LINE AI 客服', 'AI intake · LINE AI support'),
        T('CRM・客戶追蹤', 'CRM · customer tracking'),
        T('行銷內容・報價・提案', 'Marketing content · quotes · proposals'),
        T('專案管理・數據分析・AI 月報', 'Projects · analytics · AI monthly report'),
        T('客製化企業系統・品牌網站', 'Custom systems · brand sites')
      ],
      lineLabel: T('LINE 官方帳號', 'LINE official account'),
      demoLabel: T('預約 AI 導入評估', 'Build your Phase-1 draft'),
      legal: T('奇鋒國際有限公司', 'PeakQi International Ltd.'),
      privacyLabel: T('隱私權政策', 'Privacy policy'),
      demoHref: EP('/demo'),
      privacyHref: EP('/privacy')
    };
  }
}
</script>
</body>
</html>
