<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0 }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffffff }
  /* 鋪滿整個視窗:不管截圖視窗實際多大,tile 都是全幅,之後等比縮圖即可 */
  .tile { position: fixed; inset: 0; background: #090B0E; display: flex; align-items: center; justify-content: center }
  .rr { border-radius: 21.875vmin }   /* = 112/512,與原 favicon 圓角比例一致 */
  svg { width: 72vmin; height: 72vmin; display: block }
</style>
</head>
<body>
<div id="tile" class="tile">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="#FF6B2C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="48" r="43"/>
    <path d="M20 62 A31 31 0 1 1 80 62"/>
    <path d="M42 28 A16 16 0 1 1 42 60"/>
    <path d="M42 38 A6.5 6.5 0 1 1 42 51"/>
  </g>
  <path d="M42 24 V90" stroke="#FF6B2C" stroke-width="8.4" stroke-linecap="round"/>
</svg>
</div>
<script>
  if (new URLSearchParams(location.search).get('mode') === 'rr') document.getElementById('tile').classList.add('rr');
</script>
</body>
</html>
