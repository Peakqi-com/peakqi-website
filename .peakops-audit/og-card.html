<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #090B0E; color: #F2EFE8; font-family: 'Noto Sans TC', sans-serif; position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(242,239,232,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(242,239,232,.045) 1px, transparent 1px);
    background-size: 72px 72px; }
  .glow { position: absolute; right: -180px; top: -180px; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,44,.16) 0%, rgba(255,107,44,0) 68%); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #FF6B2C; }
  .wrap { position: absolute; left: 96px; top: 96px; right: 96px; }
  .logo { display: flex; align-items: center; gap: 20px; }
  .mark { width: 64px; height: 64px; border-radius: 50%; border: 5px solid #FF6B2C; position: relative; }
  .mark::after { content: ''; position: absolute; inset: 11px; border-radius: 50%; border: 5px solid #FF6B2C; opacity: .55; }
  .brand { font: 700 44px 'Space Grotesk', sans-serif; letter-spacing: .01em; }
  .brand small { font: 700 22px 'Noto Sans TC', sans-serif; color: rgba(242,239,232,.65); margin-left: 14px; letter-spacing: .3em; }
  .kicker { margin-top: 74px; font: 700 24px 'Space Grotesk', sans-serif; letter-spacing: .34em; color: #FF6B2C; }
  h1 { margin-top: 26px; font: 900 76px/1.28 'Noto Sans TC', sans-serif; letter-spacing: .01em; }
  h1 span { color: #FF6B2C; }
  .foot { position: absolute; left: 96px; right: 96px; bottom: 64px; display: flex; justify-content: space-between; align-items: center;
    font: 500 24px 'Space Grotesk', sans-serif; color: rgba(242,239,232,.6); letter-spacing: .12em; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #65E0BC; margin-right: 12px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="bar"></div>
  <div class="wrap">
    <div class="logo">
      <div class="mark"></div>
      <div class="brand">PeakQi<small>奇鋒國際</small></div>
    </div>
    <div class="kicker">AI OPERATING SYSTEM FOR TAIWAN SMEs</div>
    <h1>讓 AI 接住<span>每一個客戶</span>。</h1>
  </div>
  <div class="foot">
    <span><span class="dot"></span>客服・CRM・報價・行銷・專案</span>
    <span>www.peakqi.com</span>
  </div>
</body>
</html>
