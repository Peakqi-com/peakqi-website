# Sveltia CMS 設定 ── /admin
#
# 這份設定只管 content/blog/*.md(唯一內容來源)。產出的網頁不歸它管,
# 由 .github/workflows/build-blog.yml 在推上 main 之後重建。
#
# ⚠ 欄位要對得上 tools/md.mjs 的 parseFrontMatter 與 tools/build-blog.mjs 的消費方式:
#   - date 一律 YYYY-MM-DD(沒有時間),因為下游直接把字串當日期用
#   - draft 用布林,下游是字串比對 meta.draft === 'true',寫出的 `draft: true` 剛好相容
#   - tags 用多選,CMS 會寫成 YAML 區塊清單;md.mjs 已能把它併回逗號分隔字串
#     (手寫稿的 `tags: a, b` 也照常支援,兩種都吃)

backend:
  name: github
  repo: Peakqi-com/peakqi-website
  branch: main
  # 只有一個人登入,用 Personal Access Token(登入畫面選 Sign In with Token)。
  # 要改成「點 GitHub 授權」的多人模式,在這裡加 base_url 指向 OAuth proxy 即可,
  # 其餘設定都不用動。

# 中英雙語:檔名是 <slug>.zh.md / <slug>.en.md,對應 multiple_files
i18n:
  structure: multiple_files
  locales: [zh, en]
  default_locale: zh

media_folder: assets/blog
public_folder: /assets/blog

collections:
  - name: blog
    label: 觀點文章
    label_singular: 文章
    description: 寫完記得把「草稿」關掉,否則不會產出網頁。存檔會直接 commit 進 main,接著由 GitHub Action 重建網站。
    folder: content/blog
    extension: md
    format: frontmatter
    create: true
    # slug 上線後不能改(改了等於換網址,排名歸零)—— 所以用手填而不是從標題自動產生
    slug: '{{fields.slug}}'
    summary: '{{title}}'
    thumbnail: cover
    sortable_fields: [date, title]
    i18n: true
    editor:
      # 關掉右側預覽欄。Sveltia 的預設預覽只是把表單欄位再列一次,
      # 跟左邊完全重複,卻吃掉一半螢幕寬 —— 編輯器因此被擠得很窄。
      # 真的想看成品長怎樣,本機 node tools/serve.mjs 看實際頁面更準。
      preview: false
    fields:
      - label: 標題
        name: title
        widget: string
        i18n: true
        hint: 同時是瀏覽器分頁標題與分享預覽的標題
      - label: 摘要
        name: summary
        widget: text
        i18n: true
        hint: 一句話。同時當列表摘要與 og:description,中文 60 字 / 英文 155 字內
      - label: 網址代號 (slug)
        name: slug
        widget: string
        i18n: duplicate
        hint: 只能用小寫英數與連字號,會直接變成 /blog/<slug>。上線後不要再改。
        pattern: ['^[a-z0-9-]+$', '只能用小寫英數與連字號']
      - label: 發佈日期
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: false
        i18n: duplicate
      - label: 標籤
        name: tags
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        # 這六個要跟 tools/build-blog.mjs 的 TAGS 一致,填別的重建時會警告並被丟掉
        options:
          - { label: 'AI 導入 (ai-adoption)', value: ai-adoption }
          - { label: '流程自動化 (automation)', value: automation }
          - { label: '客戶經營 (customer-ops)', value: customer-ops }
          - { label: '產業觀察 (industry)', value: industry }
          - { label: '製作筆記 (build-notes)', value: build-notes }
          - { label: '公司動態 (news)', value: news }
      - label: 同日排序權重
        name: order
        widget: number
        value_type: int
        required: false
        i18n: duplicate
        hint: 同一天有多篇時,數字大的排前面;平常留空。
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        required: false
        i18n: duplicate
        hint: 打開就完全不產出網頁。要發佈時關掉它。
      - label: 內文
        name: body
        widget: markdown
        i18n: true
        hint: 大標由「標題」提供,內文請從 ## 開始。圖片一律用絕對路徑 /assets/blog/...
      - label: 封面圖
        name: cover
        widget: image
        required: false
        i18n: duplicate
        hint: 留空會自動配一塊莫蘭迪色帶
      - label: 封面圖替代文字
        name: coverAlt
        widget: string
        required: false
        i18n: true
      - label: 更新日期
        name: updated
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        i18n: duplicate
        hint: 只有大幅改寫時才填。會顯示「更新於」並更新 sitemap 的 lastmod
